name: npm-publish

on:
  push:
    tags: ['v*']

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: node --test test/plugin.test.mjs test/market-server.test.mjs
      - run: pnpm pack
      - name: Require NPM_TOKEN
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: |
          echo "::error::NPM_TOKEN secret is not set. Add it in Settings → Secrets and variables → Actions → New repository secret (value: an npmjs.com access token), then re-run this workflow or re-tag."
          exit 1
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
